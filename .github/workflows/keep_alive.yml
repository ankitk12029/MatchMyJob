name: Keep Alive

on:
  schedule:
    - cron: '0 * * * *'  # every 60 minutes
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl -s -o /dev/null -w "HTTP status: %{http_code}\n" https://matchmyjob.streamlit.app
